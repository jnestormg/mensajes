<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Mensajería LAN</title>
    <meta name="description" content="Sistema de mensajería en tiempo real dentro de la red local.">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mensajería LAN">
    <script>
        (function () {
            try {
                var match = document.cookie.match(/(?:^|;\s*)theme=([^;]*)/);
                var theme = match ? match[1] : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
            } catch (e) {}
        })();
    </script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <h1>Mensajería LAN</h1>
            <p>Escribe tu nombre:</p>
            <input id="name-input" class="login-select" type="text" maxlength="30" placeholder="Tu nombre aquí" autocomplete="nickname">
            <p id="login-error" class="error-message hidden"></p>
            <button id="connect-btn" class="btn btn-primary">Conectar</button>
            <a id="change-name-link" class="change-name-link hidden" href="#">Cambiar de nombre</a>
        </div>
    </div>

    <div id="app-screen" class="app-screen hidden">
        <header class="app-header">
            <h1>Mensajería LAN</h1>
            <div class="header-actions">
                <span id="current-user" class="current-user"></span>
                <button id="theme-btn" class="btn btn-mute" title="Cambiar tema de color">🌙</button>
                <button id="install-btn" class="btn btn-mute hidden" title="Instalar la aplicación">📥</button>
                <button id="mute-btn" class="btn btn-mute" title="Silenciar sonido de notificaciones">🔔</button>
            </div>
        </header>

        <div class="app-body">
            <aside class="sidebar">
                <h2>CLIENTES CONECTADOS</h2>
                <ul id="clients-list" class="clients-list"></ul>
                <div id="connection-status" class="connection-status connected">
                    <span class="status-dot"></span>
                    <span id="status-text">Conectado</span>
                </div>
            </aside>

            <main class="chat-area">
                <div id="chat-header" class="chat-header">
                    <span id="chat-header-text">Selecciona un destino</span>
                    <span id="typing-indicator" class="typing-indicator hidden"></span>
                </div>

                <div id="messages-container" class="messages-container"></div>

                <div class="message-form">
                    <input type="text" id="message-input" maxlength="1000" placeholder="Escribe un mensaje..." autocomplete="off">
                    <input type="hidden" id="target-input" value="ALL">
                    <button id="send-btn" class="btn btn-primary">Enviar</button>
                </div>
            </main>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
