services:
  mensajeria-lan:
    build: .
    container_name: mensajeria-lan
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      AUTO_OPEN: "0"
    volumes:
      - certs_data:/app/certs

volumes:
  certs_data: